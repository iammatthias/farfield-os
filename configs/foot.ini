# farfield — foot terminal config.
# Larger default font so the dashboard is legible from across the room.
#
# IBM Plex Mono is the brand's technical voice (docs/BRAND.md §3); it lacks
# the Nerd/powerline/braille glyphs btop and the shell prompt lean
# on, so JetBrainsMono Nerd Font stays in the stack as the glyph fallback,
# then plain monospace.
#
# pad gives the borderless kiosk tiles a little breathing room inside
# the compositor frame — the board panels dropped their own box border (sway
# already draws one), so the content would otherwise kiss the edge.

[main]
font=IBM Plex Mono:size=14, JetBrainsMono Nerd Font:size=14, monospace:size=14
pad=6x4

[colors]
alpha=1.0
# Deep Space field with Paper ink (docs/BRAND.md §2). foot's default
# background — and ANSI black (regular0) — is #242424, an off-black grey
# that showed as visible seams between panes. Pin both to the brand field
# so every surface reads as one continuous ground.
background=0e222d
foreground=f3e5d1
regular0=0e222d

[cursor]
# Horizon orange block — the signal.
color=0e222d e59f67

[scrollback]
lines=10000
