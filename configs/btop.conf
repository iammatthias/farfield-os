#? Config file for btop v. 1.x

# farfield os — btop backs the ssh dashboard fallback and ad-hoc use. The
# farfield theme keeps it on brand (Paper ink, Deep Space panels, the
# terrestrial→sun→alarm load gradient). theme_background = False makes
# btop transparent to the terminal background (foot paints the Deep Space
# field), so every pane sits on one consistent ground.
color_theme = "farfield"
theme_background = False

# 24-bit colour for smooth graph gradients.
truecolor = True
