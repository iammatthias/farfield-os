# Cap container log growth — json-file defaults to unbounded. Applied to
# every service below via `logging: *default-logging`. Takes effect per
# container on its next recreate.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Network ingress. Owns the tailnet identity. Other services share its
  # network namespace so they reach the tailnet directly + can proxy to
  # one another via localhost.
  #
  # WARNING: because this container OWNS the shared netns, restarting or
  # recreating it alone orphans caddy/cloudflared — they keep a handle
  # on the dead namespace and drop off the network. Never
  # `docker compose restart tailscale` by itself; always cycle the whole
  # stack with `docker compose up -d` (or `down` then `up -d`).
  tailscale:
    # Pinned to the version verified on this deployment. Bump
    # deliberately: edit the tag, `docker compose pull`, `up -d`.
    image: tailscale/tailscale:v1.96.5
    container_name: ff-tailscale
    logging: *default-logging
    hostname: ${TS_HOSTNAME:-farfield}
    environment:
      # Set in .env (copy from .env.example) for unattended bring-up:
      #   TS_AUTHKEY=tskey-auth-...
      # Or leave unset and run `docker compose exec tailscale tailscale up` once.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-farfield}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---ssh}
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # `extra_hosts` MUST live on the netns owner. Sibling containers
    # using `network_mode: service:tailscale` share /etc/hosts, so this
    # propagates automatically. (Published ports would also have to live
    # here — none are published: ingress is tailnet + cloudflared only.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Healthy once tailscaled is up AND logged in to the tailnet
      # (`status` exits nonzero while starting or logged out). Gates
      # caddy/cloudflared below so they never race the netns owner. On a
      # fresh box without TS_AUTHKEY this stays unhealthy until the
      # one-time `docker compose exec tailscale tailscale up`.
      test: ["CMD", "/usr/local/bin/tailscale", "status", "--peers=false"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Reverse proxy for everything served from the box. Edits to ./Caddyfile
  # take effect with `docker compose exec caddy caddy reload`.
  caddy:
    # Custom build — adds the caddy-dns/cloudflare module so caddy can
    # do ACME DNS-01 against Cloudflare (required for LE wildcard certs
    # on *.$PREVIEW_APEX).
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: ff-caddy:latest
    container_name: ff-caddy
    logging: *default-logging
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      # Caddy substitutes {$PREVIEW_APEX} and {env.CF_API_TOKEN} in the
      # Caddyfile at config-load / cert-issuance time. Defaults mirror
      # .env.example so the file still parses if .env hasn't been
      # customized yet.
      PREVIEW_APEX: ${PREVIEW_APEX:-previews.example.com}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      # ACME guard for the :443 wildcard-preview site. When
      # CF_API_TOKEN is set this resolves to "https" and the Caddyfile's
      # gated import pulls in preview-https/wildcard.caddy; when it's
      # empty the import glob matches nothing and caddy never attempts
      # DNS-01 (which would retry forever with an empty token).
      PREVIEW_HTTPS: ${CF_API_TOKEN:+https}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Gated :443 wildcard-preview site (see PREVIEW_HTTPS above).
      - ./preview-https:/etc/caddy/preview-https:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      # Static "online" homepage served at the preview apex + default :80.
      - ./homepage:/srv/homepage:ro
      # Project files — so `add-preview-site hello /srv/projects/foo`
      # can serve straight out of the project's own dir without copying.
      - /srv/projects:/srv/projects:ro
      # Per-preview caddy fragments — one .caddy file per preview,
      # written by `add-preview-site` and imported into the wildcard
      # HTTPS block at config-load time.
      - ./preview-handles:/etc/caddy/preview-handles:ro
    # host.docker.internal resolution comes from the tailscale service
    # — containers sharing its netns inherit /etc/hosts.
    restart: unless-stopped

  # Cloudflare Tunnel connector — opt-in via the "cloudflared" compose
  # profile. Token-managed: the tunnel and its public hostnames are
  # configured in the Cloudflare Zero Trust dashboard; the connector
  # authenticates with CLOUDFLARED_TOKEN (set in /srv/stack/.env). No
  # cert.pem / config.yml needed. Profile-gated so token-less installs
  # don't crash-loop a connector with nothing to auth as — enable it by
  # ALSO setting COMPOSE_PROFILES=cloudflared in /srv/stack/.env.
  cloudflared:
    # Pinned — cloudflared cuts monthly YYYY.M.P releases and `latest`
    # moves under you. Bump policy: read the release notes
    # (https://github.com/cloudflare/cloudflared/releases), edit the
    # tag, then `docker compose pull cloudflared && docker compose up -d`.
    # 2026.3.0 is the version verified running on this deployment.
    image: cloudflare/cloudflared:2026.3.0
    container_name: ff-cloudflared
    profiles: ["cloudflared"]
    logging: *default-logging
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
      caddy:
        condition: service_started
    command: tunnel --no-autoupdate run
    environment:
      # :- default so profile-less installs don't warn about the unset var.
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN:-}
    restart: unless-stopped
