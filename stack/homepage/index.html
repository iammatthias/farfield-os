<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e192a">
<title>Farfield OS</title>
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'><rect%20width='64'%20height='64'%20rx='12'%20fill='%230e222d'/><circle%20cx='32'%20cy='32'%20r='13'%20fill='none'%20stroke='%23f3e5d1'%20stroke-width='2'%20opacity='.8'/><circle%20cx='32'%20cy='32'%20r='3.5'%20fill='%23e59f67'/></svg>">
<meta name="description" content="Farfield OS — an opinionated home-server bootstrap for Arch Linux. One script, one small computer, managed over SSH.">
<link rel="canonical" href="https://os.farfield.systems/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="farfield">
<meta property="og:url" content="https://os.farfield.systems/">
<meta property="og:title" content="Farfield OS">
<meta property="og:description" content="An opinionated home-server bootstrap for Arch Linux. One script, one small computer, managed over SSH.">
<meta property="og:image" content="https://os.farfield.systems/hero.jpg">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
  /* The apex pattern, on this box's own plate: the landscape carries the
     page, one copy block in the open sky, two actions, nothing to scroll. */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ff-space:#0e222d;
    --ff-paper:#f3e5d1;
    --ff-horizon:#e59f67;
    --ff-sky:#0e192a; /* sampled from the plate's upper field */
    --font-display:"Newsreader",Georgia,serif;
    --font-sans:"Inter",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  html,body{height:100%;width:100%}
  body{background:var(--ff-sky);overflow:hidden}

  /* The plate. Wide screens: full bleed, the server tower center, its
     signal arcing to the edge. Tall screens: the banner holds the bottom of
     the page at its own scale — it is a horizon already — and the flat
     field above extends its sky. */
  .plate{
    position:fixed;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:46% 72%;
  }
  @media (max-aspect-ratio: 9/10){
    body{overflow:auto}
    .plate{
      top:auto;bottom:0;
      height:auto;max-height:60vh;
      object-fit:contain;object-position:bottom;
      -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%);
      mask-image:linear-gradient(to bottom,transparent 0,#000 12%);
    }
  }

  /* Copy sits in the open left sky, away from the tower and the arc. */
  .copy{
    position:fixed;
    top:clamp(4rem, 26vh, 19rem);
    left:clamp(1.5rem, 5vw, 4.5rem);
    right:clamp(1.25rem, 6vw, 6rem);
    max-width:40ch;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1.4rem;
    color:var(--ff-paper);
  }
  @media (max-aspect-ratio: 9/10){
    .copy{
      position:static;
      max-width:40ch;
      padding:calc(env(safe-area-inset-top) + 3.5rem) 7vw 0;
    }
  }

  h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(3rem, 8vw, 5.5rem);
    line-height:.96;
    letter-spacing:-.025em;
    text-wrap:balance;
    text-shadow:0 1px 3px rgba(8,14,26,.5);
  }
  .lede{
    font-family:var(--font-sans);
    font-weight:400;
    font-size:clamp(1rem, 1.4vw, 1.3rem);
    line-height:1.5;
    color:rgba(243,229,209,.88);
    max-width:36ch;
    text-wrap:pretty;
    text-shadow:0 1px 2px rgba(8,14,26,.55);
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:1.5rem;
  }
  .button-primary{
    font-family:var(--font-sans);
    font-weight:500;
    font-size:.95rem;
    color:var(--ff-space);
    background:var(--ff-horizon);
    border:1px solid var(--ff-horizon);
    border-radius:4px;
    padding:.6rem 1.2rem;
    text-decoration:none;
    text-shadow:none;
    transition:background 140ms ease-out,border-color 140ms ease-out;
  }
  .button-primary:hover{background:#eeb183;border-color:#eeb183}
  .button-primary:focus-visible{outline:2px solid var(--ff-horizon);outline-offset:2px}
  .alt-link{
    font-family:var(--font-mono);
    font-size:.85rem;
    font-weight:500;
    letter-spacing:.08em;
    color:rgba(243,229,209,.92);
    text-decoration:none;
    border-bottom:1px solid rgba(243,229,209,.45);
    padding-bottom:2px;
    text-shadow:0 1px 2px rgba(8,14,26,.55);
    transition:color 140ms ease-out,border-color 140ms ease-out;
  }
  .alt-link:hover{color:var(--ff-paper);border-color:rgba(243,229,209,.8)}
  .alt-link:focus-visible{outline:2px solid var(--ff-horizon);outline-offset:3px}
  @media (max-aspect-ratio: 9/10){
    h1,.lede,.alt-link{text-shadow:none}
  }
</style>
</head>
<body>
<img class="plate" src="/hero.webp" alt="A halftone print: a lone server tower on a vast reflective plain at dusk, one thin signal arcing from the machine to a distant point of light." fetchpriority="high">
<main class="copy">
  <h1>Farfield&nbsp;OS</h1>
  <p class="lede">An opinionated home-server bootstrap for Arch&nbsp;Linux. One script, one small computer, managed over&nbsp;SSH.</p>
  <nav class="actions" aria-label="Primary">
    <a class="button-primary" href="/docs/">Documentation&nbsp;&rarr;</a>
    <a class="alt-link" href="https://farfield.systems/">farfield.systems</a>
  </nav>
</main>
</body>
</html>
